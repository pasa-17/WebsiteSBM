<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Panel Admin – Sabilul Muttaqin</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="notif" class="notif"></div><div class="adm">
<div id="login" class="card"><h2>Masuk Admin</h2><form id="fl"><label>Username<input name="u" required autocomplete="username"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><button class="btn amber">Masuk</button></form></div>
<div id="panel" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h2>Panel Admin</h2><span><b id="who"></b> <button class="btn ghost sm" id="out">Keluar</button></span></div>
<div class="tabs"><button data-t="pendaftar" class="on">Pendaftar</button><button data-t="berita">Berita</button><button data-t="galeri">Galeri</button><button data-t="biaya">Biaya</button><button data-t="pengaturan">Pengaturan</button></div>
<div id="t-pendaftar" class="x"></div>
<div id="t-galeri" hidden></div><div id="t-biaya" hidden></div><div id="t-pengaturan" hidden></div>
<div id="t-berita" hidden><form id="fb" class="card"><input type="hidden" name="id"><div class="fg"><label>Judul<input name="judul" required></label><label>Kategori<input name="kategori" placeholder="PPDB / Kegiatan"></label><label>Tanggal<input name="tanggal" type="date"></label><label>Link gambar<input name="gambar"></label></div><label>Ringkasan<textarea name="ringkasan" rows="2"></textarea></label><label>Tampil<select name="tampil"><option>YA</option><option>TIDAK</option></select></label><button class="btn amber">Simpan Berita</button> <button type="reset" class="btn ghost sm">Baru</button></form><div id="bl" class="x" style="margin-top:1rem"></div></div></div></div>
<script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
